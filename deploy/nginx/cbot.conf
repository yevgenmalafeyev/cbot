# /etc/nginx/conf.d/cbot.conf
# Public entry for the links the bots hand out (screen, secret entry, downloads).
# Replace bot.example.com, install, then `certbot --nginx -d bot.example.com`
# adds the TLS half.

# Tokens in the URLs are 256-bit, so this is not what protects them; it keeps
# scanners from keeping core busy.
limit_req_zone  $binary_remote_addr  zone=cbot_rl:10m  rate=20r/s;

map $http_upgrade $cbot_connection { default upgrade; "" close; }

server {
    server_name bot.example.com;

    # link tokens are in the path: keep them out of the access log
    access_log off;

    location / {
        limit_req zone=cbot_rl burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        # core's published port (docker-compose.yml). If nginx runs on another
        # machine, use the private address of the cbot host here.
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the screen view is a WebSocket that stays open for a long time
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cbot_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    listen 80;
    listen [::]:80;
}
